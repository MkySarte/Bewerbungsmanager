name: Release

# Installer entstehen nur, wenn eine Version markiert wird - etwa:
#   git tag v1.0.0 && git push origin v1.0.0
#
# Grund: jpackage kann nicht cross-kompilieren, jedes Paket braucht seinen eigenen
# Läufer. Bei jedem Push wäre das Verschwendung, zumal macOS-Läufer den zehnfachen
# Minutenverbrauch haben.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write        # zum Anlegen der Veröffentlichung

jobs:
  # Erst prüfen, dann bauen. Sonst entstehen Installer aus kaputtem Stand.
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - run: ./mvnw -B test -Djava.awt.headless=true

  installer:
    name: Installer ${{ matrix.bezeichnung }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false      # ein defektes macOS-Paket soll Windows nicht mitreissen
      matrix:
        include:
          - os: windows-latest
            profil: windows
            bezeichnung: Windows
            muster: 'target/installer/*.exe'
          - os: macos-latest
            profil: mac
            bezeichnung: macOS
            muster: 'target/installer/*.dmg'
          - os: ubuntu-latest
            profil: linux
            bezeichnung: Linux
            muster: 'target/installer/*.deb'

    steps:
      - uses: actions/checkout@v4

      - name: Java 21 einrichten
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # jpackage erzeugt Windows-Installer über das WiX Toolset. Auf den Läufern ist
      # es nicht vorinstalliert, und Chocolatey ergänzt den PATH der bereits
      # laufenden Sitzung nicht - deshalb wird er hier ausdrücklich nachgetragen.
      - name: WiX Toolset (nur Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install wixtoolset --no-progress -y
          $bin = Get-ChildItem "C:\Program Files (x86)" -Filter "WiX Toolset*" -Directory |
                 Sort-Object Name -Descending |
                 Select-Object -First 1
          if (-not $bin) { throw "WiX Toolset wurde nicht gefunden" }
          $pfad = Join-Path $bin.FullName "bin"
          Write-Host "WiX gefunden: $pfad"
          Add-Content -Path $env:GITHUB_PATH -Value $pfad

      # Für ein .deb braucht jpackage fakeroot und dpkg-deb.
      - name: Paketwerkzeuge (nur Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot binutils

      # Die Version im Installer soll der Marke entsprechen, nicht der in der pom.xml
      # eingetragenen. Aus "v1.2.3" wird "1.2.3".
      - name: Version aus der Marke übernehmen
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            echo "Keine Versionsmarke (${GITHUB_REF_NAME}) - Version aus der pom.xml wird verwendet."
          else
            echo "Setze Version auf $VERSION"
            ./mvnw -B versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          fi

      - name: Installer bauen
        shell: bash
        run: ./mvnw -B -P${{ matrix.profil }} clean package jpackage:jpackage -DskipTests

      - name: Ergebnis hochladen
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.bezeichnung }}
          path: ${{ matrix.muster }}
          if-no-files-found: error     # lieber laut scheitern als leer veröffentlichen

  veroeffentlichen:
    name: Veröffentlichung anlegen
    needs: installer
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Installer einsammeln
        uses: actions/download-artifact@v4
        with:
          path: dateien
          merge-multiple: true

      - name: Übersicht
        run: ls -lh dateien/

      # Der Text kommt aus einer Datei statt aus der Befehlszeile: In doppelten
      # Anführungszeichen würde die Shell Backticks als Befehl ausführen.
      - name: Begleittext schreiben
        run: |
          cat > hinweise.md <<'ENDE'
          ## Installation

          | System  | Datei |
          |---------|-------|
          | Windows | `.exe` |
          | macOS   | `.dmg` |
          | Linux   | `.deb` |

          Java muss nicht installiert sein — es steckt mit im Paket.

          **Hinweis:** Die Installer sind nicht signiert. Windows meldet deshalb
          „Der Computer wurde durch Windows geschützt" (Weitere Informationen →
          Trotzdem ausführen), macOS „Entwickler nicht verifiziert"
          (Rechtsklick → Öffnen).

          Alle Daten bleiben auf dem eigenen Rechner und werden verschlüsselt
          gespeichert — siehe [SICHERHEIT.md](SICHERHEIT.md).
          ENDE
          cat hinweise.md

      # Über die mitgelieferte GitHub-CLI statt einer fremden Aktion - eine
      # Abhängigkeit weniger, die man im Auge behalten müsste.
      - name: Veröffentlichung erstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Bewerbungsmanager $GITHUB_REF_NAME" \
            --notes-file hinweise.md \
            dateien/*
